<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">Compute Value</title>
  <desc id="desc">Local hardware research for real workloads, showing abstract compute cards connected by a data path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e191b"/>
      <stop offset="0.55" stop-color="#091113"/>
      <stop offset="1" stop-color="#070b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f768"/>
      <stop offset="1" stop-color="#70e6d2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#70e6d2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#70e6d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8fff6" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1185" cy="82" r="330" fill="url(#glow)"/>
  <path d="M0 348C238 291 414 404 655 336s398-40 785-174" fill="none" stroke="#c8f768" stroke-opacity=".09" stroke-width="2"/>

  <g transform="translate(78 74)">
    <rect width="64" height="64" rx="18" fill="url(#accent)"/>
    <path d="M20 22h24v20H20zM16 27h4m24 0h4m-32 10h4m24 0h4M27 18v4m10-4v4m-10 20v4m10-4v4" fill="none" stroke="#07100f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="78" y="190" fill="#f4f8f5" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">COMPUTE VALUE</text>
  <text x="82" y="232" fill="#a4b2ae" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" letter-spacing="3">LOCAL HARDWARE RESEARCH FOR REAL WORKLOADS</text>
  <text x="82" y="292" fill="#dce7e3" font-family="Inter,Arial,sans-serif" font-size="23">Performance · capacity · price · power · compatibility · evidence</text>
  <g transform="translate(82 331)">
    <rect width="162" height="42" rx="21" fill="#c8f768" fill-opacity=".09" stroke="#c8f768" stroke-opacity=".32"/>
    <circle cx="24" cy="21" r="5" fill="#c8f768"/>
    <text x="40" y="27" fill="#c8f768" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">SOURCE-LINKED</text>
    <rect x="176" width="156" height="42" rx="21" fill="#70e6d2" fill-opacity=".07" stroke="#70e6d2" stroke-opacity=".28"/>
    <text x="198" y="27" fill="#70e6d2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">COMMUNITY-READY</text>
  </g>

  <g transform="translate(995 116)" filter="url(#shadow)">
    <rect width="334" height="208" rx="22" fill="#10191b" stroke="#2b3b3e"/>
    <rect x="22" y="22" width="290" height="44" rx="12" fill="#162225" stroke="#314447"/>
    <circle cx="46" cy="44" r="9" fill="#c8f768"/>
    <rect x="66" y="37" width="108" height="7" rx="3.5" fill="#f4f8f5" fill-opacity=".75"/>
    <rect x="66" y="49" width="72" height="5" rx="2.5" fill="#70817d"/>
    <g transform="translate(22 84)">
      <rect width="88" height="90" rx="14" fill="#0a1113" stroke="#243336"/>
      <text x="15" y="28" fill="#70817d" font-family="monospace" font-size="10">TOKENS/S</text>
      <text x="15" y="60" fill="#c8f768" font-family="monospace" font-size="24" font-weight="700">128.4</text>
    </g>
    <g transform="translate(123 84)">
      <rect width="88" height="90" rx="14" fill="#0a1113" stroke="#243336"/>
      <text x="15" y="28" fill="#70817d" font-family="monospace" font-size="10">VRAM</text>
      <text x="15" y="60" fill="#70e6d2" font-family="monospace" font-size="24" font-weight="700">48GB</text>
    </g>
    <g transform="translate(224 84)">
      <rect width="88" height="90" rx="14" fill="#0a1113" stroke="#243336"/>
      <text x="15" y="28" fill="#70817d" font-family="monospace" font-size="10">VALUE</text>
      <text x="15" y="60" fill="#82b7ff" font-family="monospace" font-size="24" font-weight="700">#01</text>
    </g>
  </g>
  <circle cx="1370" cy="390" r="4" fill="#c8f768"/>
  <circle cx="1342" cy="390" r="4" fill="#70e6d2" fill-opacity=".5"/>
</svg>
